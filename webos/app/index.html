<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Mad for Audio</title>
    <style>
        html, body { margin: 0; height: 100%; background: #121110; color: #d8cfc2;
            font-family: sans-serif; display: flex; align-items: center; justify-content: center; }
        .msg { text-align: center; font-size: 28px; letter-spacing: 0.04em; }
        .sub { margin-top: 16px; font-size: 20px; opacity: 0.55; }
    </style>
</head>
<body>
    <div class="msg">Mad for Audio
        <div class="sub" id="status">하이파이 랙을 켜는 중…</div>
    </div>
    <script>
        // 호스팅된 본체로 넘어가는 래퍼 — 배포는 지금처럼 GitHub Pages에 push만 하면 된다.
        // location.replace라 히스토리가 남지 않고, 리모컨 '뒤로'는 곧장 앱 종료로 이어진다.
        // boot=tv — 첫 실행은 몰입 화면 + KBS 1FM 자동 재생, 이후엔 마지막 상태 복원
        var APP_URL = 'https://ducklove.github.io/mad-for-audio/?boot=tv';
        var tries = 0;
        // 예전에는 HEAD로 도달 가능한지 먼저 확인한 뒤 넘어갔는데, 그 왕복이 켜자마자
        // 통째로 대기 시간이 됐다(TV는 DNS·TLS부터 새로 맺는다). onLine은 즉시 답하므로
        // 같은 보호(네트워크가 아직 안 올라온 부팅 직후)를 왕복 없이 얻는다.
        function go() {
            if (navigator.onLine === false) {
                tries += 1;
                document.getElementById('status').textContent =
                    '네트워크 연결 대기 중… (' + tries + '회 재시도)';
                setTimeout(go, 2000);
                return;
            }
            location.replace(APP_URL);
        }
        window.addEventListener('online', go);
        go();
    </script>
</body>
</html>
