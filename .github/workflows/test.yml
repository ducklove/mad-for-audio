name: 테스트

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  track-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install fastapi==0.136.0 httpx==0.28.1 python-dotenv==1.2.1
      - name: 곡 분리 서비스 검증
        run: python -m unittest discover -s local-analysis -p test_analysis.py -v
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: 의존성 설치
        working-directory: tests
        run: npm ci

      - name: Playwright 브라우저 설치
        working-directory: tests
        run: npx playwright install --with-deps chromium webkit

      - name: 스모크 테스트
        working-directory: tests
        run: npm test

      - name: 실패 기록 업로드 (트레이스·스크린샷)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/test-results/
          retention-days: 7
